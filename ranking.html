<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="초친 포럼 유저 랭킹 - 부문별 순위, 클리어 포인트, 하디스트 레벨 종합 리더보드" />
  <title>유저 랭킹 - 초친 포럼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="level.css" />
  <link rel="stylesheet" href="all.css" />
  <link rel="stylesheet" href="ranking.css" />
</head>

<body>
  <div class="bg"></div>
  <header class="header">
    <span class="header-nickname"></span>
    <div class="header-main-buttons">
      <a href="index.html">
        <button class="button">
          <span class="icon">홈</span>
        </button>
      </a>
      <a href="level.html">
        <button class="button">
          <span class="icon">레벨</span>
        </button>
      </a>
      <a href="maps.html">
        <button class="button">
          <span class="icon">맵 팩</span>
        </button>
      </a>
      <a href="ranking.html">
        <button class="button active">
          <span class="icon">랭킹</span>
        </button>
      </a>
      <a href="tools.html">
        <button class="button">
          <span class="icon">도구</span>
        </button>
      </a>
    </div>
    <button class="optionbutton"><span class="icon">▼</span></button>
    <div class="optionmenu">
      <button class="option-item">계정 선택</button>
      <button class="option-item">배경 설정</button>
    </div>
  </header>

  <!-- Unified Main Glass Container -->
  <div class="box ranking-container-box">
    <!-- Header Section inside Box -->
    <div class="ranking-header-section">
      <div class="ranking-header-title-group">
        <h2 class="ranking-main-title">Ranking Leaderboard</h2>
        <p class="ranking-subtitle">초친 포럼 유저들의 분야별 순위 및 포인트 랭킹</p>
      </div>

      <div class="ranking-mode-tabs">
        <button class="ranking-tab active" data-mode="classic">Classic</button>
        <button class="ranking-tab" data-mode="challenge">Challenge</button>
        <button class="ranking-tab" data-mode="platformer">Platformer</button>
        <button class="ranking-tab" data-mode="hardest">Hardest</button>
      </div>
    </div>

    <!-- Table Header Bar -->
    <div class="ranking-table-header" id="ranking-table-header">
      <span class="col-rank">순위</span>
      <span class="col-name">유저 이름</span>
      <span class="col-pt">포인트</span>
      <span class="col-hardest">하디스트 레벨</span>
      <span class="col-clears">클리어 맵 개수</span>
    </div>

    <!-- Scrollable Ranking List Body -->
    <div id="ranking-list-body" class="ranking-list-body"></div>
  </div>

  <div class="shadow"></div>

  <!-- Nickname Input Modal -->
  <div class="nickname-modal-overlay">
    <div class="nickname-input-box">
      <h2>닉네임 설정</h2>
      <input type="text" id="nickname-input" placeholder="새 닉네임을 입력하세요" />
      <div class="modal-buttons">
        <button id="nickname-submit-btn" class="modal-btn">확인</button>
        <button id="nickname-cancel-btn" class="modal-btn">취소</button>
      </div>
    </div>
  </div>

  <!-- Background Settings Modal -->
  <div class="bg-modal-overlay">
    <div class="nickname-input-box">
      <h2>배경 설정</h2>
      <div class="bg-input-group">
        <label>배경 유형</label>
        <div class="switch-container">
          <span>단색</span>
          <label class="switch">
            <input type="checkbox" id="bg-type-toggle" checked>
            <span class="slider"></span>
          </label>
          <span>그라데이션</span>
        </div>
      </div>
      <div class="bg-input-group">
        <label>시작 색상 (Hex)</label>
        <div class="color-picker-row">
          <input type="color" id="bg-color1" value="#404040">
          <input type="text" id="bg-color1-hex" value="#404040" maxlength="7">
        </div>
      </div>
      <div class="bg-input-group" id="bg-color2-group">
        <label>끝 색상 (Hex)</label>
        <div class="color-picker-row">
          <input type="color" id="bg-color2" value="#202020">
          <input type="text" id="bg-color2-hex" value="#202020" maxlength="7">
        </div>
      </div>
      <div class="bg-input-group" id="bg-angle-group">
        <label>그라데이션 각도 (0~360°)</label>
        <input type="number" id="bg-angle" value="135" min="0" max="360">
      </div>
      <div class="modal-buttons">
        <button id="bg-submit-btn" class="modal-btn">적용</button>
        <button id="bg-reset-btn" class="modal-btn">초기화</button>
        <button id="bg-cancel-btn" class="modal-btn">취소</button>
      </div>
    </div>
  </div>

  <!-- Developer Tools Modal -->
  <div class="dev-modal-overlay">
    <div class="dev-panel">
      <div id="dev-password-section">
        <h2>개발자 도구 인증</h2>
        <p class="dev-desc">하디스트 랭킹 관리를 위해 시스템 비밀번호를 입력하세요.</p>
        <input type="password" id="dev-pw-input" name="dev-password-field" autocomplete="new-password" placeholder="비밀번호 입력" class="dev-input" />
        <div class="modal-buttons">
          <button id="dev-pw-submit" class="modal-btn">확인</button>
          <button id="dev-pw-cancel" class="modal-btn">취소</button>
        </div>
      </div>
      <div id="dev-content-section" style="display: none">
        <h2>하디스트 랭킹 관리</h2>
        <div class="dev-console">
          <p style="color: #0f0">> 하디스트 랭킹 관리자 접속 완료...</p>
        </div>
        <div id="dev-main-controls">
          <div class="dev-button-grid">
            <button id="dev-user-add-open-btn" class="modal-btn dev-action-btn">
              하디스트 등록
            </button>
            <button id="dev-user-edit-open-btn" class="modal-btn dev-action-btn">
              하디스트 수정/삭제
            </button>
            <button id="dev-github-sync-btn" class="modal-btn dev-action-btn dev-btn-sync">
              GitHub 동기화
            </button>
            <button id="dev-settings-open-btn" class="modal-btn dev-action-btn">
              GitHub 설정
            </button>
            <button id="dev-reset-data-btn" class="modal-btn dev-action-btn dev-btn-danger">
              데이터 초기화
            </button>
          </div>
        </div>

        <!-- 1. 하디스트 신규 등록 서브 패널 -->
        <div id="dev-user-add-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>하디스트 랭킹 신규 등록</strong></p>
          <input type="text" id="dev-user-add-name" placeholder="유저 닉네임 *" class="dev-input" />
          <input type="text" id="dev-user-add-hardest" placeholder="하디스트 레벨 (ex: Wasureta (AREDL #349)) *" class="dev-input" />
          <div class="dev-button-grid">
            <button id="dev-user-add-submit-btn" class="modal-btn dev-action-btn dev-btn-primary">등록 저장</button>
            <button id="dev-user-add-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>

        <!-- 2. 하디스트 수정/삭제 서브 패널 -->
        <div id="dev-user-edit-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>하디스트 정보 수정 / 삭제</strong></p>
          <select id="dev-user-edit-select" class="dev-select">
            <option value="">-- 수정할 유저 선택 --</option>
          </select>
          <div id="dev-user-edit-fields" style="display: none">
            <input type="text" id="dev-user-edit-name" placeholder="유저 닉네임 *" class="dev-input" />
            <input type="text" id="dev-user-edit-hardest" placeholder="하디스트 레벨 *" class="dev-input" />
            <div class="dev-button-grid">
              <button id="dev-user-edit-submit-btn" class="modal-btn dev-action-btn dev-btn-primary">수정 저장</button>
              <button id="dev-user-edit-delete-btn" class="modal-btn dev-action-btn dev-btn-danger">유저 삭제</button>
            </div>
          </div>
          <div class="dev-button-grid" style="margin-top: 10px;">
            <button id="dev-user-edit-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>

        <!-- 3. GitHub 설정 서브 패널 -->
        <div id="dev-settings-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>GitHub API 설정</strong></p>
          <input type="text" id="dev-gh-repo" placeholder="GitHub Repository (user/repo)" class="dev-input" />
          <input type="password" id="dev-gh-token" placeholder="GitHub Personal Access Token" class="dev-input" />
          <div class="dev-button-grid">
            <button id="dev-gh-save-btn" class="modal-btn dev-action-btn dev-btn-primary">설정 저장</button>
            <button id="dev-settings-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="all.js"></script>
  <script src="ranking.js"></script>
</body>

</html>
