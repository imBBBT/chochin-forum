<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="초친 포럼 Platformer 부문 - 플랫포머 모드 레벨 리스트 및 상세 정보" />
  <title>Platformer 레벨 - 초친 포럼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../level.css" />
  <link rel="stylesheet" href="../all.css" />
  <link rel="stylesheet" href="classic.css" />
</head>

<body>
  <div class="bg"></div>
  <header class="header">
    <span class="header-nickname"></span>
    <div class="header-main-buttons">
      <a href="../index.html">
        <button class="button">
          <span class="icon">홈</span>
        </button>
      </a>
      <a href="../level.html">
        <button class="button">
          <span class="icon">레벨</span>
        </button>
      </a>
      <a href="../maps.html">
        <button class="button">
          <span class="icon">맵 팩</span>
        </button>
      </a>
      <a href="../ranking.html">
        <button class="button">
          <span class="icon">랭킹</span>
        </button>
      </a>
      <a href="../tools.html">
        <button class="button">
          <span class="icon">도구</span>
        </button>
      </a>
    </div>
    <button class="optionbutton"><span class="icon">▼</span></button>
    <div class="optionmenu">
      <button class="option-item">계정 선택</button>
      <button class="option-item">배경 설정</button>
    </div>
  </header>

  <div id="classic-list-container" class="box classic-list-box">
    <div class="classic-list-header">
      <div class="classic-list-header-top">
        <div class="classic-list-title-group">
          <h2 class="classic-list-main-title">Platformer</h2>
          <span id="classic-total-badge" class="classic-banner-badge">TOTAL 0</span>
        </div>
        <div class="classic-mode-tabs">
          <a href="classic.html" class="classic-mode-tab">Classic</a>
          <a href="challenge.html" class="classic-mode-tab">Challenge</a>
          <a href="platformer.html" class="classic-mode-tab active">Platformer</a>
        </div>
      </div>
      <div class="classic-search-box">
        <svg class="classic-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
        <input type="search" id="classic-search-input" name="classic-search-query" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="제목, 제작자, 맵 ID 검색..." />
        <button id="classic-search-clear" class="classic-search-clear" aria-label="검색어 지우기" style="display: none;">✕</button>
      </div>
      <div class="classic-tag-filter-section">
        <div class="classic-tag-filter-info">
          <span class="classic-tag-guide-text">태그: <span class="guide-inc">+ 포함</span> · <span class="guide-exc">- 제외</span></span>
          <div class="classic-tag-action-btns">
            <button id="classic-tag-reset-btn" class="classic-tag-reset-btn" style="display: none;">필터 초기화</button>
            <button id="classic-tag-toggle-btn" class="classic-tag-toggle-btn">태그 펼치기 ▼</button>
          </div>
        </div>
        <div id="classic-tag-chips-wrapper" class="classic-tag-chips-wrapper"></div>
      </div>
    </div>
    <div id="classic-level-list-body" class="classic-level-list"></div>
  </div>
  <div id="classic-detail-container" class="box classic-detail-box"></div>
  <div class="shadow"></div>

  <!-- Nickname Input Modal -->
  <div class="nickname-modal-overlay">
    <div class="nickname-input-box">
      <h2>닉네임 설정</h2>
      <input type="text" id="nickname-input" name="nickname-field" autocomplete="off" placeholder="새 닉네임을 입력하세요" />
      <div class="modal-buttons">
        <button id="nickname-submit-btn" class="modal-btn">확인</button>
        <button id="nickname-cancel-btn" class="modal-btn">취소</button>
      </div>
    </div>
  </div>

  <!-- Background Settings Modal -->
  <div class="bg-modal-overlay">
    <div class="nickname-input-box">
      <h2>배경 설정</h2>
      <div class="bg-input-group">
        <label>배경 유형</label>
        <div class="switch-container">
          <span class="switch-label">단색</span>
          <label class="switch">
            <input type="checkbox" id="bg-type-toggle" />
            <span class="slider"></span>
          </label>
          <span class="switch-label">그라데이션</span>
        </div>
      </div>
      <div class="bg-input-group">
        <label for="bg-color1">색상 1</label>
        <div class="color-picker-wrapper">
          <input type="color" id="bg-color1" value="#1a1a1a" />
          <input type="text" id="bg-color1-hex" value="#1a1a1a" maxlength="7" />
        </div>
      </div>
      <div class="bg-input-group" id="bg-color2-group">
        <label for="bg-color2">색상 2</label>
        <div class="color-picker-wrapper">
          <input type="color" id="bg-color2" value="#2a2a2a" />
          <input type="text" id="bg-color2-hex" value="#2a2a2a" maxlength="7" />
        </div>
      </div>
      <div class="bg-input-group" id="bg-angle-group">
        <label for="bg-angle">그라데이션 각도 (<span id="bg-angle-val">135</span>°)</label>
        <input type="range" id="bg-angle" min="0" max="360" value="135" />
      </div>
      <div class="modal-buttons">
        <button id="bg-submit-btn" class="modal-btn">저장</button>
        <button id="bg-reset-btn" class="modal-btn secondary">초기화</button>
        <button id="bg-cancel-btn" class="modal-btn secondary">취소</button>
      </div>
    </div>
  </div>

  <!-- Developer Tools Modal -->
  <div class="dev-modal-overlay">
    <div class="dev-panel">
      <div id="dev-password-section">
        <h2>개발자 도구 인증</h2>
        <p class="dev-desc">액세스를 위해 시스템 비밀번호를 입력하세요.</p>
        <input type="password" id="dev-pw-input" name="dev-password-field" autocomplete="new-password" placeholder="비밀번호 입력" class="dev-input" />
        <div class="modal-buttons">
          <button id="dev-pw-submit" class="modal-btn">확인</button>
          <button id="dev-pw-cancel" class="modal-btn">취소</button>
        </div>
      </div>
      <div id="dev-content-section" style="display: none">
        <h2>개발자 도구</h2>
        <div class="dev-console">
          <p style="color: #0f0">> 시스템 접속 완료...</p>
          <p style="color: #0f0">> 개발자 모드가 활성화되었습니다.</p>
        </div>
        <div id="dev-main-controls">
          <div class="dev-button-grid">
            <button id="dev-level-add-open-btn" class="modal-btn dev-action-btn">
              레벨 신규 등록
            </button>
            <button id="dev-level-edit-open-btn" class="modal-btn dev-action-btn">
              레벨 정보 수정
            </button>
            <button id="dev-clear-add-open-btn" class="modal-btn dev-action-btn">
              기록 갱신
            </button>
            <button id="dev-settings-open-btn" class="modal-btn dev-action-btn">
              GitHub 설정
            </button>
            <button id="dev-log-clear-btn" class="modal-btn dev-action-btn">
              로그 초기화
            </button>
          </div>
        </div>

        <!-- 1. 레벨 신규 등록 서브 패널 -->
        <div id="dev-level-add-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>레벨 신규 등록</strong></p>
          <select id="dev-add-mode" class="dev-select">
            <option value="classic">Classic 모드</option>
            <option value="challenge">Challenge 모드</option>
            <option value="platformer" selected>Platformer 모드</option>
          </select>
          <input type="number" id="dev-add-rank" placeholder="등록 순위 (ex: 1)" value="1" min="1" class="dev-input" />
          <input type="text" id="dev-add-title" placeholder="레벨 제목 *" class="dev-input" />
          <input type="text" id="dev-add-creator" placeholder="제작자 *" class="dev-input" />
          <input type="text" id="dev-add-verifier" placeholder="베리파이어 *" class="dev-input" />
          <select id="dev-add-rating" class="dev-select">
            <option value="Featured">Rating: Featured</option>
            <option value="Legendary">Rating: Legendary</option>
            <option value="Mythic">Rating: Mythic</option>
            <option value="">Rating: 일반 (None)</option>
          </select>
          <input type="text" id="dev-add-video" placeholder="유튜브 링크 or ID (ex: swG-0J9TBug)" class="dev-input" />
          <input type="text" id="dev-add-mapid" placeholder="맵 ID" class="dev-input" />
          <select id="dev-add-length" class="dev-select">
            <option value="Short">길이: Short</option>
            <option value="Medium">길이: Medium</option>
            <option value="Long" selected>길이: Long</option>
            <option value="XL">길이: XL</option>
            <option value="XXL">길이: XXL</option>
            <option value="XXXL">길이: XXXL</option>
          </select>
          <input type="text" id="dev-add-objects" placeholder="오브젝트 수 (ex: 45,000)" class="dev-input" />
          <input type="text" id="dev-add-song-name" placeholder="음악 제목" class="dev-input" />
          <input type="text" id="dev-add-song-artist" placeholder="음악 아티스트" class="dev-input" />
          <textarea id="dev-add-desc" placeholder="레벨 설명" class="dev-input dev-textarea"></textarea>
          <input type="text" id="dev-add-tags" placeholder="태그 (쉼표로 구분: Cube, Wave, Fast)" class="dev-input" />
          <div class="dev-button-grid">
            <button id="dev-add-submit-btn" class="modal-btn dev-action-btn dev-btn-primary">등록 저장</button>
            <button id="dev-add-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>

        <!-- 2. 레벨 정보 수정 서브 패널 -->
        <div id="dev-level-edit-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>레벨 정보 수정</strong></p>
          <select id="dev-edit-level-select" class="dev-select">
            <option value="">-- 수정할 레벨 선택 --</option>
          </select>
          <div id="dev-edit-form-fields" style="display: none">
            <input type="number" id="dev-edit-rank" placeholder="순위 (1부터 N)" min="1" class="dev-input" />
            <input type="text" id="dev-edit-title" placeholder="레벨 제목 *" class="dev-input" />
            <input type="text" id="dev-edit-creator" placeholder="제작자 *" class="dev-input" />
            <input type="text" id="dev-edit-verifier" placeholder="베리파이어 *" class="dev-input" />
            <select id="dev-edit-rating" class="dev-select">
              <option value="Featured">Rating: Featured</option>
              <option value="Legendary">Rating: Legendary</option>
              <option value="Mythic">Rating: Mythic</option>
              <option value="">Rating: 일반 (None)</option>
            </select>
            <input type="text" id="dev-edit-video" placeholder="유튜브 링크/ID" class="dev-input" />
            <input type="text" id="dev-edit-mapid" placeholder="맵 ID" class="dev-input" />
            <select id="dev-edit-length" class="dev-select">
              <option value="Short">길이: Short</option>
              <option value="Medium">길이: Medium</option>
              <option value="Long">길이: Long</option>
              <option value="XL">길이: XL</option>
              <option value="XXL">길이: XXL</option>
              <option value="XXXL">길이: XXXL</option>
            </select>
            <input type="text" id="dev-edit-objects" placeholder="오브젝트 수" class="dev-input" />
            <input type="text" id="dev-edit-song-name" placeholder="음악 제목" class="dev-input" />
            <input type="text" id="dev-edit-song-artist" placeholder="음악 아티스트" class="dev-input" />
            <textarea id="dev-edit-desc" placeholder="레벨 설명" class="dev-input dev-textarea"></textarea>
            <input type="text" id="dev-edit-tags" placeholder="태그 (쉼표 구분)" class="dev-input" />
            <div class="dev-button-grid">
              <button id="dev-edit-submit-btn" class="modal-btn dev-action-btn dev-btn-primary">수정 저장</button>
              <button id="dev-edit-delete-btn" class="modal-btn dev-action-btn dev-btn-danger">레벨 삭제</button>
            </div>
          </div>
          <div class="dev-button-grid" style="margin-top: 10px;">
            <button id="dev-edit-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>

        <!-- 3. 클리어 기록 갱신 서브 패널 -->
        <div id="dev-clear-add-area" style="display: none" class="dev-sub-panel">
          <p class="dev-desc"><strong>클리어 기록 갱신</strong></p>
          <select id="dev-clear-level-select" class="dev-select">
            <option value="">-- 레벨 선택 --</option>
          </select>
          <input type="text" id="dev-clear-player" placeholder="플레이어 닉네임 *" class="dev-input" />
          <input type="number" id="dev-clear-percent" placeholder="클리어 퍼센트(%) ex: 100" value="100" min="1" max="100" class="dev-input" />
          <input type="text" id="dev-clear-date" placeholder="클리어 날짜 (ex: 2026-08-13)" class="dev-input" />
          <input type="text" id="dev-clear-link" placeholder="유튜브/증거 링크 (선택)" class="dev-input" />
          <div class="dev-button-grid">
            <button id="dev-clear-submit-btn" class="modal-btn dev-action-btn dev-btn-primary">기록 등록/갱신</button>
            <button id="dev-clear-back-btn" class="modal-btn dev-action-btn">뒤로</button>
          </div>
        </div>

        <div id="dev-settings-area" style="display: none">
          <p class="dev-desc">GitHub API 연동 설정을 관리합니다.</p>
          <input type="password" id="dev-token-input" name="dev-token-field" autocomplete="new-password" placeholder="GitHub 토큰" class="dev-input" />
          <input type="text" id="dev-owner-input" placeholder="GitHub Owner (ID)" class="dev-input" />
          <input type="text" id="dev-repo-input" placeholder="Repository 이름" class="dev-input" />
          <input type="text" id="dev-path-input" placeholder="파일 경로 (ex: news.json)" class="dev-input" />
          <div class="dev-button-grid">
            <button id="dev-settings-save-btn" class="modal-btn dev-action-btn">
              저장
            </button>
            <button id="dev-settings-test-btn" class="modal-btn dev-action-btn">
              연결 테스트
            </button>
          </div>
          <div id="dev-settings-status" class="dev-status"></div>
        </div>
        <div class="modal-buttons">
          <button id="dev-close-btn" class="modal-btn">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../all.js"></script>
  <script src="platformer.js"></script>
</body>

</html>
